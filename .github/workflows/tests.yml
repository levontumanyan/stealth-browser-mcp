name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run test suite
        run: uv run --with pytest --with adblock --with 'mcp<2' --with patchright pytest tests/ -q
